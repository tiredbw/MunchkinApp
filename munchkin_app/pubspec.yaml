name: munchkin_app
description: "A local-first tabletop companion for Munchkin-style card games."
publish_to: 'none'
version: 0.2.0+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.5.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^9.2.0
  path_provider: ^2.1.0
  crypto: ^3.0.0
  intl: any
  google_mobile_ads: ^9.0.0
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.0
  freezed: ^3.1.0
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: "assets/icon/icon_ios.png"
  ios: true
  android: true
  adaptive_icon_background: "assets/icon/icon_adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/icon_adaptive_foreground.png"
  remove_alpha_ios: true
